name: Release

# Pull requests and main get checks. A vX.Y.Z tag on a commit in main runs the checks alongside
# the signed macOS and Android builds, uploads the packages to a draft release once everything
# passed, verifies the uploads and only then publishes it. Secrets are used only by the tag jobs.
#
# Caches: a tag can only read caches saved on main, so main saves them and tags only read.
# Main also builds the macOS app (unsigned) so its release compile is cached for the next tag.
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NDK_VERSION: 27.3.13750724

jobs:
  checks:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: pnpm install --frozen-lockfile
      - name: Versions and release notes
        run: node scripts/check-release.mjs ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
      - name: Tags must be on main
        if: startsWith(github.ref, 'refs/tags/')
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - run: pnpm typecheck
      - run: pnpm vitest run
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - run: pnpm build

  # The tag run builds the signed APK instead.
  android-check:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - run: sdkmanager "ndk;${NDK_VERSION}"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: aarch64-linux-android
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          shared-key: android
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: pnpm install --frozen-lockfile
      - name: Debug APK (no signing secrets)
        run: pnpm tauri android build --apk --debug --target aarch64
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}

  macos-release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          shared-key: macos-release
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: pnpm install --frozen-lockfile
      - name: Warm the release build cache (main, unsigned)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: pnpm tauri build --target universal-apple-darwin --bundles app --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Desktop OAuth client (public app identity only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          CLIENT_JSON: ${{ secrets.READER_GOOGLE_DESKTOP_CLIENT_JSON }}
        run: |
          id=$(jq -er '.installed.client_id' <<< "$CLIENT_JSON")
          secret=$(jq -r '.installed.client_secret // empty' <<< "$CLIENT_JSON")
          [ -n "$secret" ] && echo "::add-mask::$secret"
          echo "READER_GOOGLE_CLIENT_ID=$id" >> "$GITHUB_ENV"
          echo "READER_GOOGLE_CLIENT_SECRET=$secret" >> "$GITHUB_ENV"
      - name: Build universal app and signed updater bundle
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --target universal-apple-darwin --bundles app
      - name: Collect, with a drag-to-Applications dmg
        if: startsWith(github.ref, 'refs/tags/')
        # Tauri's bundle_dmg.sh scripts Finder to style the window, which fails on hosted runners;
        # hdiutil alone is reliable (retried for the runners' occasional "Resource busy").
        run: |
          v=${GITHUB_REF_NAME#v}
          out=src-tauri/target/universal-apple-darwin/release/bundle
          mkdir release-assets
          stage=$(mktemp -d)
          cp -R "$out/macos/Reader.app" "$stage/"
          ln -s /Applications "$stage/Applications"
          for attempt in 1 2 3; do
            hdiutil create -volname Reader -srcfolder "$stage" -ov -format UDZO "release-assets/Reader-$v-macos-universal.dmg" && break
            [ "$attempt" = 3 ] && exit 1
            sleep 10
          done
          hdiutil verify "release-assets/Reader-$v-macos-universal.dmg"
          cp "$out/macos/Reader.app.tar.gz" "release-assets/Reader-$v-macos-universal.app.tar.gz"
          cp "$out/macos/Reader.app.tar.gz.sig" "release-assets/Reader-$v-macos-universal.app.tar.gz.sig"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: macos
          path: release-assets/
          if-no-files-found: error

  android-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - run: sdkmanager "ndk;${NDK_VERSION}" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
          shared-key: android
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: pnpm install --frozen-lockfile
      - name: Signed release APK
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
          KEYSTORE_BASE64: ${{ secrets.READER_ANDROID_KEYSTORE_BASE64 }}
          READER_ANDROID_STORE_PASSWORD: ${{ secrets.READER_ANDROID_STORE_PASSWORD }}
          READER_ANDROID_KEY_PASSWORD: ${{ secrets.READER_ANDROID_KEY_PASSWORD }}
          READER_ANDROID_KEY_ALIAS: reader
        run: |
          export READER_ANDROID_KEYSTORE="$RUNNER_TEMP/release.jks"
          trap 'rm -f "$READER_ANDROID_KEYSTORE"' EXIT
          base64 -d <<< "$KEYSTORE_BASE64" > "$READER_ANDROID_KEYSTORE"
          pnpm tauri android build --apk --target aarch64
      - name: Verify the signing certificate
        run: |
          apk=$(ls src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk)
          signer="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$signer" verify "$apk"
          actual=$("$signer" verify --print-certs "$apk" | sed -n 's/.*SHA-256 digest: //p' | head -1)
          expected=$(tr -d '[:space:]' < release/android-certificate.sha256)
          [ "$actual" = "$expected" ] || { echo "APK signed by $actual, expected $expected"; exit 1; }
          mkdir release-assets && cp "$apk" "release-assets/Reader-${GITHUB_REF_NAME#v}-android-arm64.apk"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android
          path: release-assets/
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [checks, macos-release, android-release]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and updater manifest
        run: |
          node scripts/latest-json.mjs "${TAG#v}" dist dist/latest.json
          (cd dist && for f in *.dmg *.apk *.app.tar.gz; do sha256sum "$f" > "$f.sha256"; done)
          ls -l dist
      - name: Upload to a draft
        run: |
          if gh release view "$TAG" --json isDraft -q '.isDraft' 2>/dev/null | grep -q false; then
            echo "$TAG is already published; publish a new version instead of replacing assets."; exit 1
          fi
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --verify-tag --title "Reader ${TAG#v}" --notes-file "docs/releases/${TAG#v}.md"
          gh release upload "$TAG" dist/* --clobber
      - name: Verify uploads, then publish
        run: |
          mkdir check
          gh release download "$TAG" --dir check
          for f in dist/*; do cmp "$f" "check/$(basename "$f")" || { echo "Upload of $(basename "$f") differs"; exit 1; }; done
          gh release edit "$TAG" --draft=false --latest
